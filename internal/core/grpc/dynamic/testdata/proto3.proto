// Test messages for the dynamic codec: proto3 scalars, repeated fields,
// maps, oneofs, optional fields and unknown fields.
syntax = "proto3";

package codec.p3;

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
}

message Nested {
  int32 a = 1;
  string b = 2;
  Nested child = 3;
}

// Superset is Nested with more fields; its encodings are decoded as Nested
// to test unknown fields.
message Superset {
  int32 a = 1;
  string b = 2;
  Nested child = 3;
  fixed64 extra_fixed64 = 4;
  bytes extra_bytes = 5;
  sfixed32 extra_fixed32 = 6;
  uint64 extra_varint = 7;
  repeated sint32 extra_packed = 8;
  Nested extra_message = 9;
}

message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Color f_enum = 16;
  Nested f_nested = 17;
}

message Repeated {
  repeated double r_double = 1;
  repeated float r_float = 2;
  repeated int32 r_int32 = 3;
  repeated int64 r_int64 = 4;
  repeated uint32 r_uint32 = 5;
  repeated uint64 r_uint64 = 6;
  repeated sint32 r_sint32 = 7;
  repeated sint64 r_sint64 = 8;
  repeated fixed32 r_fixed32 = 9;
  repeated fixed64 r_fixed64 = 10;
  repeated sfixed32 r_sfixed32 = 11;
  repeated sfixed64 r_sfixed64 = 12;
  repeated bool r_bool = 13;
  repeated string r_string = 14;
  repeated bytes r_bytes = 15;
  repeated Color r_enum = 16;
  repeated Nested r_nested = 17;

  repeated int32 u_int32 = 30 [packed = false];
  repeated sint64 u_sint64 = 31 [packed = false];
  repeated double u_double = 32 [packed = false];
  repeated Color u_enum = 33 [packed = false];
  repeated bool u_bool = 34 [packed = false];
  repeated fixed32 u_fixed32 = 35 [packed = false];
}

message Maps {
  map<int32, Nested> m_int32 = 1;
  map<int64, Nested> m_int64 = 2;
  map<uint32, Nested> m_uint32 = 3;
  map<uint64, Nested> m_uint64 = 4;
  map<sint32, Nested> m_sint32 = 5;
  map<sint64, Nested> m_sint64 = 6;
  map<fixed32, Nested> m_fixed32 = 7;
  map<fixed64, Nested> m_fixed64 = 8;
  map<sfixed32, Nested> m_sfixed32 = 9;
  map<sfixed64, Nested> m_sfixed64 = 10;
  map<bool, Nested> m_bool = 11;
  map<string, Nested> m_string = 12;
  map<string, string> m_string_string = 13;
  map<string, bytes> m_string_bytes = 14;
  map<int32, Color> m_int32_enum = 15;
  map<string, double> m_string_double = 16;
  map<uint64, sint64> m_uint64_sint64 = 17;
}

// Oneof members have the highest numbers, so that field number order is
// also the order protobuf-go's deterministic encoding uses.
message Oneofs {
  string plain = 1;
  oneof choice {
    int32 o_int32 = 10;
    string o_string = 11;
    Nested o_nested = 12;
    Color o_enum = 13;
    bytes o_bytes = 14;
  }
}

message Optionals {
  optional int32 o_int32 = 1;
  optional string o_string = 2;
  optional bool o_bool = 3;
  optional double o_double = 4;
  optional Color o_enum = 5;
  optional Nested o_nested = 6;
  int32 implicit_int32 = 7;
  double implicit_double = 8;
}
