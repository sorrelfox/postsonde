// Written for the PostSonde linker tests: a small HTTP mapping schema in the
// style of Google API annotations. Not a copy of googleapis.

syntax = "proto3";

package google.api;

option go_package = "example.com/thirdparty/google/api;annotations";

// Http holds the HTTP rules of a service.
message Http {
  repeated HttpRule rules = 1;
  bool fully_decode_reserved_expansion = 2;
}

// HttpRule maps an RPC to an HTTP method and path.
message HttpRule {
  string selector = 1;

  oneof pattern {
    string get = 2;
    string put = 3;
    string post = 4;
    string delete = 5;
    string patch = 6;
    CustomHttpPattern custom = 8;
  }

  string body = 7;
  string response_body = 12;
  repeated HttpRule additional_bindings = 11;
}

// CustomHttpPattern is a method other than the standard ones.
message CustomHttpPattern {
  string kind = 1;
  string path = 2;
}
