syntax = "proto3";

package shop.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "shop/options/options.proto";
import "shop/v1/common.proto";

option (shop.options.owner) = "orders-team";
option java_multiple_files = true;

// Order is a customer order.
message Order {
  string name = 1 [(google.api.field_behavior) = IMMUTABLE];
  Status status = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Money comes from common.proto's public import.
  google.type.Money total = 3;
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.type.Date delivery_date = 5;
  map<string, Line> lines = 6;
  optional string note = 7 [(options.max_length) = 280];
  string email = 8 [(shop.options.sensitive) = true, json_name = "contact"];

  oneof destination {
    Address address = 9;
    string pickup_point = 10;
  }

  message Line {
    string sku = 1;
    int32 quantity = 2;
    google.type.Money price = 3;
    .shop.v1.Status status = 4;
  }
}

message GetOrderRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateOrderRequest {
  Order order = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message WatchOrdersRequest {
  repeated Status statuses = 1;
}

service OrderService {
  rpc GetOrder(GetOrderRequest) returns (Order) {
    option (google.api.http) = {
      get: "/v1/{name=orders/*}"
    };
  }

  rpc UpdateOrder(UpdateOrderRequest) returns (Order) {
    option (google.api.http) = {
      patch: "/v1/{order.name=orders/*}"
      body: "order"
      additional_bindings { post: "/v1/{order.name=orders/*}:update" body: "*" }
    };
    option (shop.options.audit) = { enabled: true level: HIGH tags: ["write", "orders"] };
  }

  rpc DeleteOrder(GetOrderRequest) returns (google.protobuf.Empty) {
    option (shop.options.audit).enabled = true;
    option (shop.options.audit).level = LOW;
  }

  rpc WatchOrders(WatchOrdersRequest) returns (stream Order);
  rpc ImportOrders(stream Order) returns (google.protobuf.Empty);
  rpc Sync(stream Order) returns (stream Order);
}
