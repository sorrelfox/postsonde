edition = "2023";

package shop.v1;

option features.field_presence = IMPLICIT;
option features.utf8_validation = NONE;

message Inventory {
  string warehouse = 1;
  int32 count = 2 [features.field_presence = EXPLICIT];
  string owner = 3 [features.field_presence = LEGACY_REQUIRED];
  Bin bin = 4 [features.message_encoding = DELIMITED];
  repeated int32 slots = 5 [features.repeated_field_encoding = EXPANDED];
  Mode mode = 6 [features.field_presence = EXPLICIT];

  message Bin {
    string code = 1;
  }

  reserved one, two;
}

enum Mode {
  option features.enum_type = CLOSED;
  MODE_A = 1;
  MODE_B = 2;
}

service InventoryService {
  rpc Get(Inventory) returns (Inventory);
}
