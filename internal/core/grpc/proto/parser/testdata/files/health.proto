// A health checking service in the shape of the standard gRPC health
// protocol (grpc.health.v1). Written for PostSonde's parser tests.

syntax = "proto3";

package grpc.health.v1;

option csharp_namespace = "Grpc.Health.V1";
option go_package = "google.golang.org/grpc/health/grpc_health_v1";
option java_multiple_files = true;
option java_outer_classname = "HealthProto";
option java_package = "io.grpc.health.v1";

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;  // Used only by the Watch method.
  }
  ServingStatus status = 1;
}

message HealthListRequest {}

message HealthListResponse {
  // Health status of every known service, keyed by service name.
  map<string, HealthCheckResponse> statuses = 1;
}

// Health is the service checked by load balancers and orchestrators.
service Health {
  // Check returns the serving status of one service, or NOT_FOUND.
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

  // List returns the status of all services.
  rpc List(HealthListRequest) returns (HealthListResponse);

  // Watch streams the serving status whenever it changes.
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
