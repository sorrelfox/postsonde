// Equivalents of the protobuf well-known types (Any, Duration, Empty,
// FieldMask, Struct, Timestamp and the wrappers), written from the public
// type definitions for PostSonde's parser tests. This is not the upstream
// file; the real definitions are bundled separately.

syntax = "proto3";

package google.protobuf;

option cc_enable_arenas = true;
option go_package = "google.golang.org/protobuf/types/known/structpb";
option java_multiple_files = true;
option objc_class_prefix = "GPB";
option csharp_namespace = "Google.Protobuf.WellKnownTypes";

// A message of any type, identified by a type URL.
message Any {
  string type_url = 1;
  bytes value = 2;
}

// A signed span of time with nanosecond resolution.
message Duration {
  int64 seconds = 1;
  int32 nanos = 2;
}

// An empty message, for methods without a request or response.
message Empty {}

// A set of field paths.
message FieldMask {
  repeated string paths = 1;
}

// A point in time, independent of time zone.
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

// A JSON object.
message Struct {
  map<string, Value> fields = 1;
}

// A JSON value.
message Value {
  // The kind of value.
  oneof kind {
    NullValue null_value = 1;
    double number_value = 2;
    string string_value = 3;
    bool bool_value = 4;
    Struct struct_value = 5;
    ListValue list_value = 6;
  }
}

// The JSON null value.
enum NullValue {
  NULL_VALUE = 0;
}

// A JSON array.
message ListValue {
  repeated Value values = 1;
}

message DoubleValue { double value = 1; }
message FloatValue { float value = 1; }
message Int64Value { int64 value = 1; }
message UInt64Value { uint64 value = 1; }
message Int32Value { int32 value = 1; }
message UInt32Value { uint32 value = 1; }
message BoolValue { bool value = 1; }
message StringValue { string value = 1; }
message BytesValue { bytes value = 1; }
