// Test schema for the protobuf JSON mapping. Oneof members use the
// highest field numbers so that protobuf-go's deterministic encoding and
// PostSonde's agree on field order (see README.md).
syntax = "proto3";

package jsontest;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/rpc/status.proto";

enum Color {
  option allow_alias = true;
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
  CRIMSON = 1;
  NEGATIVE = -5;
}

message Nested {
  int32 a = 1;
  string s = 2;
  Nested child = 3;
}

message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Color f_enum = 16;
  Nested f_message = 17;
}

message Names {
  int32 foo_bar_baz = 1;
  int32 _leading = 2;
  int32 trailing_ = 3;
  int32 x_1y = 4;
  int32 camelCase = 5;
  int32 with_json_name = 6 [json_name = "custom"];
  int32 double__under = 7;
  int32 UPPER = 8;
}

message Repeateds {
  repeated double r_double = 1;
  repeated float r_float = 2;
  repeated int32 r_int32 = 3;
  repeated int64 r_int64 = 4;
  repeated uint32 r_uint32 = 5;
  repeated uint64 r_uint64 = 6;
  repeated sint32 r_sint32 = 7;
  repeated sint64 r_sint64 = 8;
  repeated fixed32 r_fixed32 = 9;
  repeated fixed64 r_fixed64 = 10;
  repeated sfixed32 r_sfixed32 = 11;
  repeated sfixed64 r_sfixed64 = 12;
  repeated bool r_bool = 13;
  repeated string r_string = 14;
  repeated bytes r_bytes = 15;
  repeated Color r_enum = 16;
  repeated Nested r_message = 17;
  repeated int32 r_unpacked = 18 [packed = false];
}

message Maps {
  map<string, string> string_string = 1;
  map<int32, int32> int32_int32 = 2;
  map<int64, int64> int64_int64 = 3;
  map<uint32, uint32> uint32_uint32 = 4;
  map<uint64, uint64> uint64_uint64 = 5;
  map<sint32, sint32> sint32_sint32 = 6;
  map<sint64, sint64> sint64_sint64 = 7;
  map<fixed32, fixed32> fixed32_fixed32 = 8;
  map<fixed64, fixed64> fixed64_fixed64 = 9;
  map<sfixed32, sfixed32> sfixed32_sfixed32 = 10;
  map<sfixed64, sfixed64> sfixed64_sfixed64 = 11;
  map<bool, bool> bool_bool = 12;
  map<string, bytes> string_bytes = 13;
  map<string, double> string_double = 14;
  map<string, float> string_float = 15;
  map<string, Color> string_enum = 16;
  map<string, Nested> string_message = 17;
  map<int32, google.protobuf.Value> int32_value = 18;
  map<string, google.protobuf.NullValue> string_null = 19;
}

message Oneofs {
  int32 before = 1;
  oneof choice {
    string o_string = 10;
    int32 o_int32 = 11;
    Nested o_message = 12;
    Color o_enum = 13;
    bytes o_bytes = 14;
    google.protobuf.Value o_value = 15;
    google.protobuf.NullValue o_null = 16;
    google.protobuf.Int32Value o_wrapper = 17;
  }
}

message Optionals {
  optional int32 o_int32 = 1;
  optional int64 o_int64 = 2;
  optional string o_string = 3;
  optional bool o_bool = 4;
  optional Color o_enum = 5;
  optional double o_double = 6;
  optional bytes o_bytes = 7;
  optional Nested o_message = 8;
  int32 plain = 9;
  Nested plain_message = 10;
  repeated int32 plain_list = 11;
  map<string, int32> plain_map = 12;
}

message WellKnown {
  google.protobuf.Any any = 1;
  google.protobuf.Timestamp timestamp = 2;
  google.protobuf.Duration duration = 3;
  google.protobuf.Struct struct = 4;
  google.protobuf.Value value = 5;
  google.protobuf.ListValue list_value = 6;
  google.protobuf.NullValue null_value = 7;
  google.protobuf.FieldMask field_mask = 8;
  google.protobuf.Empty empty = 9;
  google.protobuf.DoubleValue double_value = 10;
  google.protobuf.FloatValue float_value = 11;
  google.protobuf.Int64Value int64_value = 12;
  google.protobuf.UInt64Value uint64_value = 13;
  google.protobuf.Int32Value int32_value = 14;
  google.protobuf.UInt32Value uint32_value = 15;
  google.protobuf.BoolValue bool_value = 16;
  google.protobuf.StringValue string_value = 17;
  google.protobuf.BytesValue bytes_value = 18;
  google.rpc.Status status = 19;

  repeated google.protobuf.Any r_any = 20;
  repeated google.protobuf.Value r_value = 21;
  repeated google.protobuf.Timestamp r_timestamp = 22;
  repeated google.protobuf.Int64Value r_int64_value = 23;
  repeated google.protobuf.NullValue r_null_value = 24;
  map<string, google.protobuf.Value> m_value = 25;
  map<string, google.protobuf.Duration> m_duration = 26;
  map<string, google.protobuf.StringValue> m_string_value = 27;
  optional google.protobuf.NullValue o_null_value = 28;
}

// Payload types for google.protobuf.Any.
message AnyPayload {
  string name = 1;
  int64 id = 2;
  google.protobuf.Any inner = 3;
  Color color = 4;
  map<string, int32> counts = 5;
}
