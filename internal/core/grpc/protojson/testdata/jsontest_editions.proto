// Edition 2023 test schema for the protobuf JSON mapping: delimited
// fields with and without group-like names, implicit presence and legacy
// required fields.
edition = "2023";

package jsonedition;

message Item {
  int32 x = 1;
}

message Other {
  int32 y = 1;
}

message Editions {
  // Group-like: a delimited field named after its nested type in lower
  // case, so its proto (text) name is the type name.
  message Grouped {
    int32 z = 1;
  }
  Grouped grouped = 7 [features.message_encoding = DELIMITED];
  Item item = 1 [features.message_encoding = DELIMITED];
  Other payload = 2 [features.message_encoding = DELIMITED];
  int32 implicit = 3 [features.field_presence = IMPLICIT];
  int32 explicit = 4;
  string must = 5 [features.field_presence = LEGACY_REQUIRED];
  repeated int32 numbers = 6;
}
