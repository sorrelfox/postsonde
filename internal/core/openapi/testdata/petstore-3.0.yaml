openapi: 3.0.3
info:
  title: Petstore 3.0
  description: A pet store that uses the OpenAPI 3.0 features.
  termsOfService: https://petstore.example/terms
  contact:
    name: Pet API team
    url: https://petstore.example/support
    email: api@petstore.example
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: More about the store
  url: https://petstore.example/docs
servers:
  - url: '{scheme}://petstore.example/{basePath}'
    variables:
      scheme:
        enum: [https, http]
        default: https
      basePath:
        default: v1
        description: API version
tags:
  - name: pets
    description: Everything about your pets
    externalDocs:
      url: https://petstore.example/docs/pets
  - name: store
  - name: users
security:
  - petstore_auth: [write:pets, read:pets]
paths:
  /pets:
    get:
      tags: [pets]
      summary: List all pets
      operationId: listPets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            exclusiveMaximum: true
          example: 20
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [available, pending, sold]
          examples:
            one:
              summary: One status
              value: [available]
            two:
              value: [available, pending]
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
            X-Rate-Limit:
              $ref: '#/components/headers/RateLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pets'
            application/xml:
              schema:
                type: array
                xml:
                  name: pets
                  wrapped: true
                items:
                  $ref: '#/components/schemas/Pet'
        4XX:
          $ref: '#/components/responses/ClientError'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [pets]
      summary: Create a pet
      operationId: createPet
      requestBody:
        $ref: '#/components/requestBodies/Pet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
          links:
            GetPetById:
              operationId: showPetById
              parameters:
                petId: $response.body#/id
        default:
          $ref: '#/components/responses/Error'
      callbacks:
        petAdopted:
          '{$request.body#/callbackUrl}?event=adopted':
            post:
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Pet'
              responses:
                '200':
                  description: Callback received
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: The id of the pet to retrieve
        schema:
          type: string
    get:
      tags: [pets]
      summary: Info for a specific pet
      operationId: showPetById
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              examples:
                cat:
                  $ref: '#/components/examples/Cat'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [pets]
      operationId: deletePet
      deprecated: true
      parameters:
        - name: api_key
          in: header
          schema:
            type: string
      security:
        - api_key: []
        - basic: []
      responses:
        '204':
          description: Deleted
  /pets/{petId}/photo:
    post:
      tags: [pets]
      operationId: uploadPhoto
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
        - name: session
          in: cookie
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                caption:
                  type: string
                photo:
                  type: string
                  format: binary
            encoding:
              photo:
                contentType: image/png, image/jpeg
                headers:
                  X-Photo-Source:
                    schema:
                      type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Uploaded
  /store/inventory:
    get:
      tags: [store]
      operationId: getInventory
      security:
        - api_key: []
      responses:
        '200':
          description: Quantities by status
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
  /users/me:
    get:
      tags: [users]
      operationId: getMe
      security:
        - oidc: [profile]
      servers:
        - url: https://accounts.petstore.example/v1
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    Pet:
      type: object
      required: [id, name, petType]
      discriminator:
        propertyName: petType
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          minimum: 0
          exclusiveMinimum: true
        name:
          type: string
          maxLength: 64
          example: Rex
        petType:
          type: string
        tag:
          type: string
          nullable: true
        owner:
          $ref: '#/components/schemas/User'
      xml:
        name: pet
    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            huntingSkill:
              type: string
              default: lazy
              enum: [clueless, lazy, adventurous, aggressive]
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            packSize:
              type: integer
              minimum: 0
              maximum: 20
    Pets:
      type: array
      maxItems: 100
      items:
        oneOf:
          - $ref: '#/components/schemas/Cat'
          - $ref: '#/components/schemas/Dog'
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          pattern: '^[a-z0-9_]{3,32}$'
        password:
          type: string
          format: password
          writeOnly: true
        pets:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Pet'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
  requestBodies:
    Pet:
      description: The pet to add
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
          example:
            name: Rex
            petType: dog
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/Pet'
  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ClientError:
      description: The request was not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    RateLimit:
      description: Calls per hour allowed by the user
      schema:
        type: integer
        format: int32
  examples:
    Cat:
      summary: A cat
      value:
        id: 1
        name: Tom
        petType: cat
        huntingSkill: lazy
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore.example/oauth/authorize
          scopes:
            write:pets: modify pets in your account
            read:pets: read your pets
        clientCredentials:
          tokenUrl: https://petstore.example/oauth/token
          refreshUrl: https://petstore.example/oauth/refresh
          scopes: {}
    api_key:
      type: apiKey
      name: api_key
      in: header
    basic:
      type: http
      scheme: basic
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://petstore.example/.well-known/openid-configuration
